[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "physical-ai-runtime"
version = "0.1.0"
description = "Local-first Physical AI runtime"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "aiosqlite>=0.20.0",
  "pyserial>=3.5",
  "pyserial-asyncio>=0.6",
  "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["physical_ai"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = [".", "..", "../firmware/virtual_esp32"]

[tool.ruff]
line-length = 100
