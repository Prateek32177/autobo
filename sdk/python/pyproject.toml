[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "physical-ai-sdk"
version = "0.1.0"
description = "Physical AI local runtime client SDK"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["physical_ai_sdk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
